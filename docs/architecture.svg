<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Lighthouse system design</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B3D59"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8791"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#FFFFFF"/>
  <text x="600" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0B3D59">Lighthouse — system design and trust boundaries</text>

  <!-- ===== Zone: Google ===== -->
  <rect x="20" y="56" width="455" height="520" rx="12" fill="#EEF4FB" stroke="#4A86C5" stroke-width="1.5"/>
  <text x="38" y="82" font-size="15" font-weight="700" fill="#0B3D59">Google Workspace (Gmail, Google's cloud)</text>
  <text x="38" y="100" font-size="12" fill="#5F6B73">Gmail access never leaves Google's sandbox</text>

  <rect x="45" y="118" width="405" height="46" rx="23" fill="#FFFFFF" stroke="#0B3D59" stroke-width="1.4"/>
  <text x="247" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#0B3D59">User opens an email in Gmail</text>

  <rect x="45" y="196" width="405" height="210" rx="8" fill="#FFFFFF" stroke="#0B3D59" stroke-width="1.4"/>
  <text x="62" y="222" font-size="15" font-weight="700" fill="#0B3D59">Apps Script add-on</text>
  <text x="62" y="246" font-size="12.5" fill="#2F3A41">• Code.gs — trigger, backend client, all cards</text>
  <text x="62" y="267" font-size="12.5" fill="#2F3A41">• Presentation.gs — pure helpers (unit-tested in Node)</text>
  <text x="62" y="291" font-size="12.5" fill="#2F3A41">• Reads only the open message (current.message.readonly)</text>
  <text x="62" y="312" font-size="12.5" fill="#2F3A41">• Extracts sender, Reply-To, subject, bodies, links,</text>
  <text x="73" y="330" font-size="12.5" fill="#2F3A41">attachment metadata (never file bytes)</text>
  <text x="62" y="354" font-size="12.5" fill="#2F3A41">• Trusted-contact impersonation check (local)</text>
  <text x="62" y="375" font-size="12.5" fill="#2F3A41">• "Check the links": shows real hosts, never visits them</text>
  <text x="62" y="396" font-size="12.5" fill="#2F3A41">• Escapes every string it renders (attacker text)</text>

  <rect x="45" y="436" width="125" height="64" rx="6" fill="#F7FAFC" stroke="#7A8791" stroke-width="1.2"/>
  <text x="107" y="461" text-anchor="middle" font-size="12" font-weight="700" fill="#0B3D59">UserProperties</text>
  <text x="107" y="480" text-anchor="middle" font-size="11.5" fill="#5F6B73">trusted list (≤100)</text>
  <rect x="185" y="436" width="125" height="64" rx="6" fill="#F7FAFC" stroke="#7A8791" stroke-width="1.2"/>
  <text x="247" y="461" text-anchor="middle" font-size="12" font-weight="700" fill="#0B3D59">CacheService</text>
  <text x="247" y="480" text-anchor="middle" font-size="11.5" fill="#5F6B73">result, 30 min</text>
  <rect x="325" y="436" width="125" height="64" rx="6" fill="#F7FAFC" stroke="#7A8791" stroke-width="1.2"/>
  <text x="387" y="461" text-anchor="middle" font-size="12" font-weight="700" fill="#0B3D59">Script Properties</text>
  <text x="387" y="480" text-anchor="middle" font-size="11.5" fill="#5F6B73">BACKEND_API_KEY</text>
  <line x1="107" y1="406" x2="107" y2="434" stroke="#7A8791" stroke-width="1.6" fill="none" stroke-dasharray="6 5"/>
  <line x1="247" y1="406" x2="247" y2="434" stroke="#7A8791" stroke-width="1.6" fill="none" stroke-dasharray="6 5"/>
  <line x1="387" y1="406" x2="387" y2="434" stroke="#7A8791" stroke-width="1.6" fill="none" stroke-dasharray="6 5"/>

  <rect x="45" y="516" width="405" height="44" rx="6" fill="#FFF6E5" stroke="#C98A2C" stroke-width="1.2"/>
  <text x="247" y="535" text-anchor="middle" font-size="12" font-weight="700" fill="#0B3D59">Card: score · verdict · up to 3 findings · details</text>
  <text x="247" y="552" text-anchor="middle" font-size="11.5" fill="#5F6B73">Backend down / 401 / timeout → grey "Not scanned" (never looks safe)</text>

  <!-- ===== Zone: Internet ===== -->
  <rect x="495" y="56" width="210" height="520" rx="12" fill="#F7F7F7" stroke="#9AA5AD" stroke-width="1.3" stroke-dasharray="7 5"/>
  <text x="600" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#0B3D59">Public internet</text>
  <rect x="515" y="250" width="170" height="74" rx="8" fill="#FFFFFF" stroke="#0B3D59" stroke-width="1.4"/>
  <text x="600" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#0B3D59">ngrok tunnel</text>
  <text x="600" y="296" text-anchor="middle" font-size="11.5" fill="#5F6B73">HTTPS, fixed domain</text>
  <text x="600" y="313" text-anchor="middle" font-size="11.5" fill="#5F6B73">public URL → needs auth</text>

  <!-- ===== Zone: Backend ===== -->
  <rect x="725" y="56" width="455" height="520" rx="12" fill="#EEF7F3" stroke="#2E7D6B" stroke-width="1.5"/>
  <text x="743" y="82" font-size="15" font-weight="700" fill="#1F5C4E">Backend host (FastAPI, local)</text>
  <text x="743" y="100" font-size="12" fill="#5F6B73">No outbound calls · no LLM · no persistence of email content</text>

  <rect x="750" y="118" width="405" height="56" rx="8" fill="#FFFFFF" stroke="#0B3D59" stroke-width="1.4"/>
  <text x="767" y="141" font-size="15" font-weight="700" fill="#0B3D59">Authenticate</text>
  <text x="767" y="161" font-size="12.5" fill="#2F3A41">X-Lighthouse-Key, constant-time compare → 401 never says why</text>

  <rect x="750" y="190" width="405" height="56" rx="8" fill="#FFFFFF" stroke="#0B3D59" stroke-width="1.4"/>
  <text x="767" y="213" font-size="15" font-weight="700" fill="#0B3D59">Validate (untrusted-input boundary)</text>
  <text x="767" y="233" font-size="12.5" fill="#2F3A41">Pydantic caps every string and list → 422 if oversized</text>

  <rect x="750" y="262" width="405" height="150" rx="8" fill="#FFFFFF" stroke="#0B3D59" stroke-width="1.4"/>
  <text x="767" y="285" font-size="15" font-weight="700" fill="#0B3D59">Analyze — 5 analyzers, each one vector</text>
  <text x="767" y="309" font-size="12.5" fill="#2F3A41">• Header — brand impersonation, typosquats, Reply-To</text>
  <text x="767" y="330" font-size="12.5" fill="#2F3A41">• Content — credential requests, pressure, obfuscation</text>
  <text x="767" y="351" font-size="12.5" fill="#2F3A41">• Payment request — BEC: money + pressure / personal mailbox</text>
  <text x="767" y="372" font-size="12.5" fill="#2F3A41">• Links — text vs. real site, IPs, shorteners, look-alikes</text>
  <text x="767" y="393" font-size="12.5" fill="#2F3A41">• Attachments — double extensions, executables, HTML, ISO</text>

  <rect x="750" y="428" width="405" height="72" rx="8" fill="#FFFFFF" stroke="#0B3D59" stroke-width="1.4"/>
  <text x="767" y="451" font-size="15" font-weight="700" fill="#0B3D59">Score</text>
  <text x="767" y="471" font-size="12.5" fill="#2F3A41">Sum weights per category → cap each category → 0–100</text>
  <text x="767" y="490" font-size="12.5" fill="#2F3A41">≥70 Malicious · 35–69 Suspicious · &lt;35 Safe</text>

  <rect x="750" y="516" width="405" height="44" rx="6" fill="#F7FAFC" stroke="#7A8791" stroke-width="1.2"/>
  <text x="952" y="535" text-anchor="middle" font-size="12" font-weight="700" fill="#0B3D59">backend/.env (git-ignored)</text>
  <text x="952" y="552" text-anchor="middle" font-size="11.5" fill="#5F6B73">random key created on first start; never logged</text>

  <line x1="952" y1="174" x2="952" y2="188" stroke="#0B3D59" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <line x1="952" y1="246" x2="952" y2="260" stroke="#0B3D59" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <line x1="952" y1="412" x2="952" y2="426" stroke="#0B3D59" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== Flows ===== -->
  <!-- 1: open -> add-on -->
  <line x1="247" y1="164" x2="247" y2="194" stroke="#0B3D59" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="268" cy="179" r="10" fill="#0B3D59"/><text x="268" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>

  <!-- 2: request add-on -> ngrok -> backend -->
  <path d="M450,262 L513,262" stroke="#0B3D59" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M685,262 C712,262 712,146 748,146" stroke="#0B3D59" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="482" cy="244" r="10" fill="#0B3D59"/><text x="482" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>

  <!-- 3: response backend -> ngrok -> add-on -->
  <path d="M748,470 C712,470 712,312 687,312" stroke="#0B3D59" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M515,312 L452,312" stroke="#0B3D59" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="482" cy="330" r="10" fill="#0B3D59"/><text x="482" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>

  <!-- 4: add-on -> card -->
  <path d="M30,300 C14,300 14,538 43,538" stroke="#0B3D59" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="22" cy="420" r="10" fill="#0B3D59"/><text x="22" y="424" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text>

  <!-- ===== GitHub assets ===== -->
  <rect x="20" y="600" width="455" height="62" rx="10" fill="#F4F4F4" stroke="#9AA5AD" stroke-width="1.2"/>
  <text x="38" y="625" font-size="12" font-weight="700" fill="#0B3D59">GitHub (public repo) — assets/</text>
  <text x="38" y="645" font-size="11.5" fill="#5F6B73">101 animated score GIFs + icons, loaded by Gmail over HTTPS (CardService can't draw)</text>
  <path d="M460,600 C460,580 460,580 452,560" stroke="#7A8791" stroke-width="1.6" fill="none" stroke-dasharray="6 5" marker-end="url(#arrowGrey)"/>

  <!-- ===== Legend / what crosses the boundary ===== -->
  <rect x="495" y="600" width="685" height="140" rx="10" fill="#FFFFFF" stroke="#C9D2D8" stroke-width="1.2"/>
  <text x="515" y="625" font-size="12" font-weight="700" fill="#0B3D59">Steps</text>
  <text x="515" y="646" font-size="12.5" fill="#2F3A41"><tspan font-weight="700">1</tspan> Gmail fires the contextual trigger for the open message.</text>
  <text x="515" y="666" font-size="12.5" fill="#2F3A41"><tspan font-weight="700">2</tspan> POST /api/v1/analyze — parsed fields + attachment metadata, with X-Lighthouse-Key.</text>
  <text x="515" y="686" font-size="12.5" fill="#2F3A41"><tspan font-weight="700">3</tspan> JSON: score, verdict, reasons[] (one per rule that fired).</text>
  <text x="515" y="706" font-size="12.5" fill="#2F3A41"><tspan font-weight="700">4</tspan> Add-on applies the local impersonation check and renders the card.</text>
  <text x="515" y="728" font-size="11.5" fill="#5F6B73">Never sent to the backend: attachment bytes, images, other emails, the trusted list. The backend calls nothing else.</text>

  <text x="38" y="690" font-size="11.5" fill="#5F6B73">──── request / response</text>
  <text x="38" y="710" font-size="11.5" fill="#5F6B73">- - - - storage access / static asset fetch</text>
</svg>
