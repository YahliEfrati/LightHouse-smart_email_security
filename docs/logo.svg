<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128">
  <title>Lighthouse</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05192A"/>
      <stop offset="0.65" stop-color="#0B3D59"/>
      <stop offset="1" stop-color="#145A7A"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF4C2" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFE9A0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFE9A0" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE38A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFE38A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="128" height="128" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="url(#sky)"/>
    <g fill="#FFFFFF">
      <circle cx="96" cy="70" r="1.1" opacity="0.7"/><circle cx="110" cy="84" r="0.9" opacity="0.6"/>
      <circle cx="18" cy="20" r="1.1" opacity="0.7"/><circle cx="30" cy="40" r="0.8" opacity="0.5"/>
    </g>
    <!-- beam -->
    <polygon points="52,42 128,12 128,50 52,50" fill="url(#beam)"/>
    <circle cx="52" cy="46" r="20" fill="url(#glow)"/>
    <!-- sea -->
    <path d="M0,108 C16,104 32,112 48,108 S80,104 96,108 S120,112 128,108 L128,128 L0,128 Z" fill="#062638"/>
    <path d="M0,116 C18,112 34,120 52,116 S88,112 106,116 S124,119 128,116" fill="none" stroke="#2C7FA6" stroke-width="1.4" opacity="0.7"/>
    <!-- rock -->
    <path d="M26,110 L36,98 L48,100 L58,94 L72,99 L82,110 Z" fill="#0A2433"/>
    <!-- tower -->
    <polygon points="38,102 66,102 61,58 43,58" fill="#FFFFFF"/>
    <polygon points="41.4,80 62.6,80 61.7,71 42.3,71" fill="#D32F2F"/>
    <polygon points="39.6,96 64.4,96 63.6,88 40.4,88" fill="#D32F2F"/>
    <rect x="40" y="56" width="24" height="4" rx="1.2" fill="#37474F"/>
    <!-- lamp room -->
    <rect x="44" y="40" width="16" height="16" fill="#FDB813"/>
    <rect x="44" y="40" width="16" height="16" fill="none" stroke="#37474F" stroke-width="1.6"/>
    <line x1="52" y1="40" x2="52" y2="56" stroke="#37474F" stroke-width="1.2"/>
    <polygon points="41,40 63,40 52,30" fill="#37474F"/>
    <circle cx="52" cy="29" r="2" fill="#37474F"/>
    <rect x="49" y="93" width="6" height="9" rx="3" fill="#37474F"/>
  </g>
</svg>
